name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs viejos del mismo PR cuando llegan pushes nuevos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Sanity check rápido: parse de Python + JSON de scripts.
  #    Falla en <30s si hay un error de sintaxis obvio.
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint (parse + json)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: AST parse — todos los .py del repo
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          errors = []
          for p in pathlib.Path('.').rglob('*.py'):
              # Excluir venv/, node_modules/, __pycache__/
              if any(part in {'.venv', 'venv', 'node_modules', '__pycache__'} for part in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{p}:{e.lineno}: {e.msg}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('OK: todos los .py parsean sin errores de sintaxis')
          EOF

      - name: Validar JSON de scripts/
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          errors = []
          for p in pathlib.Path('scripts').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'OK: {len(list(pathlib.Path("scripts").rglob("*.json")))} archivos JSON válidos')
          EOF

  # ────────────────────────────────────────────────────────────
  # 2. Tests con pytest + coverage.
  # ────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run pytest with coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-not-for-prod
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=pytest-junit.xml \
            -m "not slow and not e2e"

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest-junit.xml
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # 3. Build de Docker image — verifica que el Dockerfile no
  #    esté roto. No sube nada a registry (eso lo hace Coolify
  #    en el deploy real).
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: deskeli:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
