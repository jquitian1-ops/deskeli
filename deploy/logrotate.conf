# Rotación de logs de DeskEli / TicketDesk Enterprise
#
# Cuándo usar este archivo:
#   Solo si la app corre FUERA de Docker/Coolify escribiendo a archivos
#   (setting GUNICORN_LOG_TO_FILES=1 en el .env).
#
#   Si corre dentro de Docker/Coolify, este archivo NO se usa: el runtime
#   captura stdout/stderr y aplica su propio logging driver con rotación
#   (json-file, journald, etc.). Ver README para detalles.
#
# Instalación (host Linux):
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/deskeli
#   sudo chown root:root /etc/logrotate.d/deskeli
#   sudo chmod 644 /etc/logrotate.d/deskeli
#   sudo logrotate -d /etc/logrotate.d/deskeli   # dry-run para verificar
#
# Test manual:
#   sudo logrotate -f /etc/logrotate.d/deskeli   # force run
#
# El cron horario de logrotate (default en la mayoría de distros) hará el resto.

/opt/deskeli/logs/*.log {
    # Rotar diariamente, mantener 30 archivos comprimidos (30 días de historial).
    daily
    rotate 30

    # Comprimir con gzip los rotados a partir del segundo (el más reciente sin gz).
    compress
    delaycompress

    # No fallar si el archivo no existe (arranque limpio).
    missingok

    # No rotar si está vacío.
    notifempty

    # Truncar en vez de mover + recrear — así Gunicorn no necesita reabrir el FD.
    # Para Gunicorn con eventlet esto es lo correcto (SIGUSR1 no es confiable
    # con event-loops cooperativos).
    copytruncate

    # Permisos del archivo nuevo si `copytruncate` no aplica.
    create 640 deskeli deskeli

    # Compresión adicional para archivos > 100 MB.
    maxsize 100M
}
